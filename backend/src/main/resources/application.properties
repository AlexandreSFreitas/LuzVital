spring.application.name=luzvital-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Porta: o render.com informa pela variável PORT
server.port=${PORT:8080}

# Oracle: valores SEMPRE vindos de variáveis de ambiente (veja env.example na raiz)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.pool-name=luzvital-pool

# Nunca devolver stack trace ou mensagem interna nas respostas de erro
server.error.include-stacktrace=never
server.error.include-message=never
